seed: 0
batch_size: 16
lr: 0.0001
weight_decay: 0.00001
optimizer: adamw
max_epochs: 200
early_stop_patience: 25
# Long-running full train; safety cap ~36h wall-clock per process
max_minutes: 2160
num_workers: 2
height: 24
width: 32

# Official TAPOR base1 temporal (README often uses fs=1; architecture default is 9)
num_history: 9

# Adaptive hand mask (physics hybrids)
mask_top_frac: 0.25
mask_min_delta: 6.0

# Full-power hybrid capacity (passed into build_model)
spatial_ch: 128
kp_dim: 96
inverse_base: 64

# Loss weights
lambda_joint: 1.0
lambda_bone: 1.0
lambda_depth: 0.1
lambda_hand_depth: 1.0
lambda_recon: 0.5
lambda_mask: 0.15
lambda_heatmap: 1.0
detach_physics_for_pose: true

phase1_epochs: 30
phase1_lambda_joint: 0.25
phase1_lambda_bone: 0.25
phase1_lambda_depth: 0.2
phase1_lambda_hand_depth: 2.5
phase1_lambda_recon: 1.0
phase1_lambda_mask: 0.3
phase1_detach_physics: false

phase2_lambda_joint: 1.0
phase2_lambda_bone: 1.0
phase2_lambda_depth: 0.1
phase2_lambda_hand_depth: 1.0
phase2_lambda_recon: 0.5
phase2_lambda_mask: 0.15
phase2_detach_physics: true

# Per-model batch / lr overrides (memory + paper recipes)
model_overrides:
  hand3d:
    batch_size: 8
    lr: 0.00001
    num_history: 0
  mediapipe:
    batch_size: 16
    lr: 0.001
    num_history: 0
  nanotapor:
    batch_size: 32
    lr: 0.0001
    num_history: 0
  vanilla:
    batch_size: 24
    lr: 0.0001
    num_history: 9
  A:
    batch_size: 12
  B:
    batch_size: 16
  C:
    batch_size: 12
  D:
    batch_size: 12
